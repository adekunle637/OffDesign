<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161b22" />
    <title>OffDesign Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f2e8;
        color: #161b22;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(34rem, calc(100% - 2rem));
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 4rem;
        line-height: 0.95;
      }

      p {
        margin: 0;
        color: #4b5563;
        font-size: 1rem;
        line-height: 1.6;
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline mode</h1>
      <p>
        OffDesign is installed, but this screen was not available in the local cache yet. Reopen the app
        once you are connected so the full workspace can be refreshed for offline use.
      </p>
    </main>
  </body>
</html>
